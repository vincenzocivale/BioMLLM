hf_home: /raid/DATASETS/BioMLLMData/hf_cache

backbones:
  # USFM (openmedlab) weights are not on the HF hub and not available locally. Fallback:
  # USF-MAE, a ViT-B/16 MAE pretrained on 43 public ultrasound datasets (plain ViT, so the
  # SteerViT cross-attention can be inserted between its blocks exactly).
  usfmae:
    kind: timm_vit
    timm_name: vit_base_patch16_224
    hf_repo: mfurkan03/USF-MAE
    hf_file: USF-MAE_full_pretrain_43dataset_100epochs.pt
    image_size: 224
    mean: [0.485, 0.456, 0.406]   # MAE default (ImageNet); USF-MAE ships no preprocessing config
    std: [0.229, 0.224, 0.225]
    pool: mean
  dinov2:
    kind: hf_dinov2
    hf_repo: facebook/dinov2-base
    image_size: 224
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
    pool: cls

text_encoder:
  name: FacebookAI/roberta-large
  max_length: 32

steering:
  layers: [1, 3, 5, 7, 9, 11]   # gated cross-attention after every 2nd block (0-indexed)
  num_heads: 8
  dropout: 0.0

heads:
  dropout: 0.1

queries:
  shape: "shape of the breast lesion"
  orientation: "orientation of the breast lesion"
  margin: "margin of the breast lesion"
  echo_pattern: "echo pattern of the breast lesion"
  posterior_features: "posterior acoustic features of the breast lesion"
control_queries:
  empty: ""
  generic: "breast lesion"
