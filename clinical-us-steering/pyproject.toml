[project]
name = "clinical-us-steering"
version = "0.1.0"
description = "Text-steered frozen ultrasound foundation model for BI-RADS descriptors"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "timm>=1.0", "transformers>=4.40", "pandas", "pyarrow",
                "scikit-learn", "matplotlib", "imagehash", "pillow", "pyyaml", "openpyxl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
