[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biomllm"
version = "0.1.0"
description = "Frozen generalist MLLMs + plug-in medical foundation models via expert-conditioned task tokens"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "numpy",
    "pillow",
]

[project.optional-dependencies]
experts = [
    "transformers>=4.44",
    "timm>=1.0",
    "open_clip_torch>=2.24",
]
train = [
    "transformers>=4.44",
    "peft>=0.12",
    "accelerate>=0.33",
    "deepspeed>=0.14",
    "wandb",
]
eval = [
    "pycocotools",
    "scipy",
]
dev = [
    "pytest>=8",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
